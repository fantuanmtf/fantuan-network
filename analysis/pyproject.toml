[project]
name = "fantuan-analysis"
version = "0.1.0"
description = "Statistical analysis of Fantuan Network simulation transcripts"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }

[project.scripts]
fantuan-analysis = "fantuan_analysis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
