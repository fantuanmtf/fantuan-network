[workspace]
resolver = "3"
members = [
    "crates/fantuan-core",
    "crates/fantuan-identity",
    "crates/fantuan-msg",
    "crates/fantuan-transport",
    "crates/fantuan-sim",
    "crates/fantuan-node",
    "crates/fantuan-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
authors = ["fantuanmtf"]
repository = "https://github.com/fantuanmtf/fantuan-network"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
ciborium = "0.2"
toml = "1"

# Errors, logging, CLI
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"

# Crypto and identity
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-nettle"] }
snow = "0.10"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
blake3 = "1"

# Storage
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

# I2P SAM v3
yosemite = "0.7"

# Internal crates
fantuan-core = { path = "crates/fantuan-core" }
fantuan-identity = { path = "crates/fantuan-identity" }
fantuan-msg = { path = "crates/fantuan-msg" }
fantuan-transport = { path = "crates/fantuan-transport" }
fantuan-sim = { path = "crates/fantuan-sim" }

# Dev
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
